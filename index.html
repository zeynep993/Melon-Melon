<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #fff8f2;
  color: #29231f;
}

header {
  background: white;
  padding: 18px 30px;
  box-shadow: 0 2px 10px #00000010;
  position: sticky;
  top: 0;
  z-index: 10;
}

.nav {
  max-width: 1100px;
  margin: auto;
  display: flex;
  justify-content: space-between;

}

.logo {
  font-size: 24px;
  font-weight: bold;
  color: #e85d04;
}

.logo span {
  background: #e85d04;
  color: white;
  padding: 8px;
  border-radius: 12px;
  margin-right: 8px;
}

nav a {
  text-decoration: none;
  color: #333;
  margin-left: 20px;
}

.hero {
  padding: 70px 20px;
  background: linear-gradient(135deg,#fff0df,#ffd7ad);
}

.hero-inner {
  max-width: 1100px;
  margin: auto;
  display: flex;
  align-items: center;
  gap: 50px;
}

.hero-text {
  flex: 1;
}

.hero h1 {
  font-size: 55px;
  margin-bottom: 20px;
}

.hero h1 span {
  color: #e85d04;
}

.hero p {
  font-size: 18px;
  line-height: 1.7;
  color: #665d57;
  margin-bottom: 25px;
}

.search {
  display: flex;
  background: white;
  padding: 6px;
  border-radius: 14px;
  max-width: 550px;
}

.search input {
  flex: 1;
  border: none;
  outline: none;
  padding: 14px;
  font-size: 16px;
}

.search button {
  background: #e85d04;
  color: white;
  border: none;
  padding: 0 25px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
}

.hero-food {
  font-size: 150px;
  background: #e85d04;
  width: 350px;
  height: 300px;
  border-radius: 35px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 60px 20px;
}

h2 {
  font-size: 32px;
  margin-bottom: 10px;
}

.subtitle {
  color: #777;
  margin-bottom: 30px;
}

.categories {
  display: flex;
  gap: 10px;
  margin-bottom: 30px;
  flex-wrap: wrap;
}

.category {
  padding: 11px 18px;
  border-radius: 30px;
  border: 1px solid #eaded4;
  background: white;
  cursor: pointer;
}

.category:hover,
.category.active {
  background: #e85d04;
  color: white;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 25px;
}

.card {
  background: white;
  border-radius: 20px;
  overflow: hidden;
  border: 1px solid #eee;
  transition: .2s;
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 15px 30px #00000015;
}

.food {
  height: 190px;
  background: linear-gradient(135deg,#fff0df,#ffd19d);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 90px;
}

.card-content {
  padding: 20px;
}

.card h3 {
  font-size: 20px;
  margin-bottom: 10px;
}

.card p {
  color: #777;
  line-height: 1.5;
  font-size: 14px;
}

.info {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

.info span {
  background: #fff0e4;
  color: #d94f00;
  padding: 7px 9px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: bold;
}

.btn {
  width: 100%;
  border: none;
  background: #29231f;
  color: white;
  padding: 12px;
  border-radius: 10px;
  margin-top: 15px;
  cursor: pointer;
}

.btn:hover {
  background: #e85d04;
}

footer {
  background: #29231f;
  color: white;
  text-align: center;
  padding: 35px;
  margin-top: 40px;
}

@media(max-width:800px) {
  .hero-inner {
    flex-direction: column;
  }

  .hero h1 {
    font-size: 42px;
  }

  .hero-food {
    width: 100%;
  }

  .grid {
    grid-template-columns: 1fr 1fr;
  }
}

@media(max-width:550px) {
  nav {
    display: none;
  }

  .grid {
    grid-template-columns: 1fr;
  }
}

function goster(liste) {

  const alan =
    document.getElementById("tariflerAlani");

  alan.innerHTML = "";

  liste.forEach(function(tarif) {

    alan.innerHTML += `

      <div class="card">

        <div class="food">
          ${tarif.emoji}
        </div>

        <div class="card-content">

          <h3>
            ${tarif.ad}
          </h3>

          <p>
            ${tarif.aciklama}
          </p>

          <div class="info">

            <span>
              🔥 ${tarif.kalori} kcal
            </span>

            <span>
              ⏱️ ${tarif.sure}
            </span>

          </div>

          <button
            class="btn"
            onclick="alert('${tarif.ad}\\n\\nKalori: ${tarif.kalori} kcal\\nHazırlama: ${tarif.sure}\\n\\nAfiyet olsun! 🍴')">

            Tarifi Gör

          </button>

        </div>

      </div>

    `;

  });

}


function kategori(secim) {

  if(secim === "Tümü") {

    goster(tarifler);

  } else {

    const sonuc =
      tarifler.filter(function(tarif) {
        return tarif.kategori === secim;
      });

    goster(sonuc);

  }

}


function ara() {

  const kelime =
    document
    .getElementById("search")
    .value
    .toLowerCase();

  const sonuc =
    tarifler.filter(function(tarif) {

      return tarif.ad
        .toLowerCase()
        .includes(kelime);

    });

  goster(sonuc);

}


document
.getElementById("search")
.addEventListener("keydown", function(event) {

  if(event.key === "Enter") {
    ara();
  }

});


goster(tarifler);
